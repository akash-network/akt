name: update
description: Update a deployment and send the new manifest to providers
version: 1

params:
  sdl-file:
    type: sdl
    required: true
    description: Path to updated SDL deployment file
  dseq:
    type: int
    required: true
    description: Deployment sequence to update

steps:
  - name: update-deployment
    type: tx
    msg: deployment.MsgUpdateDeployment
    params:
      sdl: "{{ index .Params \"sdl-file\" }}"
      dseq: "{{ .Params.dseq }}"
    on-error: abort

  - name: send-manifest
    type: provider
    action: send-manifest-to-active-leases
    params:
      dseq: "{{ .Params.dseq }}"
      sdl: "{{ index .Params \"sdl-file\" }}"
    retry:
      max: 3
      delay: "5s"
    on-error: abort

  - name: display-result
    type: output
    template: |
      Deployment updated!
        DSEQ: {{ .Params.dseq }}
