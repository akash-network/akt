name: update
description: Update a deployment and send the new manifest to providers
long: |
  Update a deployment's SDL and send the revised manifest to every provider
  holding a lease on it.

  Pass --patch to supply a JSON/YAML service patch instead of a complete SDL.
  Omitted fields keep their current values. Console updates preserve stored
  secrets; --secrets-file supplies replacements. Chain patches use --base-sdl
  or the locally recorded SDL path.

  Changing the resource profile can close existing leases and re-open bidding;
  changing only the image or environment usually does not.
example: |
    # Apply a revised SDL
    akt update deploy.yaml 12345

    # Show what would change without broadcasting
    akt update deploy.yaml 12345 --dry-run

    # Apply a service patch while preserving omitted configuration
    akt update patch.yaml 12345 --patch
version: 1

params:
  sdl-file:
    type: sdl
    required: true
    description: Path to updated SDL, or a service patch with --patch
  dseq:
    type: int
    required: true
    description: Deployment sequence to update
  secrets-file:
    type: file
    description: JSON or YAML secret values file, or - for stdin (Console only)
  patch:
    type: bool
    default: "false"
    description: Interpret the input file as a service patch
  base-sdl:
    type: sdl
    description: Source SDL for a chain service patch (defaults to the recorded SDL path)

steps:
  - name: update-deployment
    type: tx
    msg: deployment.MsgUpdateDeployment
    params:
      sdl: "{{ index .Params \"sdl-file\" }}"
      dseq: "{{ .Params.dseq }}"
      secrets-file: "{{ with index .Params \"secrets-file\" }}{{ . }}{{ end }}"
      patch: "{{ .Params.patch }}"
      base-sdl: "{{ with index .Params \"base-sdl\" }}{{ . }}{{ end }}"
    on-error: abort

  - name: send-manifest
    type: provider
    action: send-manifest-to-active-leases
    params:
      dseq: "{{ .Params.dseq }}"
      sdl: "{{ index .Params \"sdl-file\" }}"
    retry:
      max: 3
      delay: "5s"
    on-error: abort

  # The update transaction records a new SDL hash on chain and nothing more.
  # Report what send-manifest actually delivered instead of asserting an
  # unconditional success: zero active leases is a successful no-op, and a
  # provider that receives an unchanged manifest restarts nothing.
  - name: display-result
    type: output
    template: |
      {{- $manifest := index .Steps "send-manifest" -}}
      {{- if not $manifest -}}
      Deployment updated.
        DSEQ: {{ .Params.dseq }}
        Manifest delivery: handled by the Console API.

        Note: a provider restarts a service only when its image reference or
        configuration actually changed; re-applying an identical manifest
        leaves the running workload as it is.
      {{- else if gt (index $manifest "count") 0 -}}
      Deployment updated.
        DSEQ: {{ .Params.dseq }}
        Manifest sent to {{ index $manifest "count" }} provider(s):
      {{ range index $manifest "providers" }}    {{ . }}
      {{ end }}
        Note: a provider restarts a service only when its image reference or
        configuration actually changed; re-applying an identical manifest
        leaves the running workload as it is.
      {{- else -}}
      Deployment updated on chain, but nothing was redeployed.
        DSEQ: {{ .Params.dseq }}

        WARNING: this deployment has no active leases, so the new manifest was
        not sent to any provider. Only the SDL hash changed on chain; no
        running workload was updated.
        List leases with "akt query market lease {{ .Params.dseq }} active".
      {{- end -}}
