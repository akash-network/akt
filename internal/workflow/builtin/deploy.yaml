name: deploy
description: Create a deployment, wait for bids, select provider, create lease, send manifest
version: 1

params:
  sdl-file:
    type: file
    required: true
    description: Path to SDL deployment file
  deposit:
    type: string
    default: "auto"
    description: "Initial deposit: 5usd or $5 (USD, console-api contexts), 5000000uakt (coin, keyring contexts), auto = chain minimum (keyring)"
  bid-timeout:
    type: duration
    default: "5m"
    description: Maximum time to wait for bids
  bid-select:
    type: string
    default: "interactive"
    description: "Bid selection: interactive, cheapest, provider=<addr>"

steps:
  - name: create-deployment
    type: tx
    msg: deployment.MsgCreateDeployment
    params:
      sdl: "{{ index .Params \"sdl-file\" }}"
      deposit: "{{ .Params.deposit }}"
    on-error: abort

  - name: wait-for-bids
    type: wait
    query: market.bids
    params:
      owner: "{{ .Account }}"
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
    timeout: "{{ index .Params \"bid-timeout\" }}"
    until: "{{ ge (len .Result.bids) 1 }}"
    on-error: abort

  - name: select-bid
    type: prompt
    mode: "{{ index .Params \"bid-select\" }}"
    data: "{{ toJson (index .Steps \"wait-for-bids\").bids }}"
    display:
      columns: [provider, price]
    on-error: abort

  - name: create-lease
    type: tx
    msg: market.MsgCreateLease
    params:
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
      gseq: "{{ (index .Steps \"select-bid\").gseq }}"
      oseq: "{{ (index .Steps \"select-bid\").oseq }}"
      provider: "{{ (index .Steps \"select-bid\").provider }}"
    on-error: abort

  - name: send-manifest
    type: provider
    action: send-manifest
    params:
      provider: "{{ (index .Steps \"select-bid\").provider }}"
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
      sdl: "{{ index .Params \"sdl-file\" }}"
    retry:
      max: 3
      delay: "5s"
    on-error: abort

  - name: display-result
    type: output
    template: |
      Deployment active!
        DSEQ: {{ (index .Steps "create-deployment").dseq }}
