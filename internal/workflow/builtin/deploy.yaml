name: deploy
description: Create a deployment, wait for bids, select provider, create lease, send manifest
long: |
  Create a deployment, wait for provider bids, select one, open the lease, and
  send the manifest to the winning provider.

  Prints the deployment sequence number (dseq) on success. Every later command
  that acts on this deployment takes that dseq.

  Runs on whichever rail the active context uses: a keyring context signs and
  broadcasts the transactions locally, a console-api context routes them through
  the Console managed wallet.
example: |
    # Deploy and choose a bid interactively
    akt deploy deploy.yaml

    # Non-interactive: take the cheapest bid
    akt deploy deploy.yaml --bid-select cheapest --yes

    # Pin to a known provider
    akt deploy deploy.yaml --bid-select provider=akash1...

    # Show what would happen without broadcasting
    akt deploy deploy.yaml --dry-run
version: 1

params:
  sdl-file:
    type: sdl
    required: true
    description: Path to SDL deployment file
  deposit:
    type: deposit
    default: "auto"
    description: "Initial deposit: auto (recommended chain minimum, keyring), 5usd or $5 (console-api), or an explicit coin in the network's deposit denomination (keyring)"
  bid-timeout:
    type: duration
    default: "5m"
    description: Maximum time to wait for bids
  bid-select:
    type: bid-selection
    default: "interactive"
    description: "Bid selection: interactive, cheapest, provider=<full-address>"

steps:
  - name: create-deployment
    type: tx
    msg: deployment.MsgCreateDeployment
    params:
      sdl: "{{ index .Params \"sdl-file\" }}"
      deposit: "{{ .Params.deposit }}"
    on-error: abort

  - name: wait-for-bids
    type: wait
    query: market.bids
    params:
      owner: "{{ .Account }}"
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
    timeout: "{{ index .Params \"bid-timeout\" }}"
    until: "{{ ge (len .Result.bids) 1 }}"
    timeout-error: "no bids received (at least 1 required)"
    on-error: abort

  - name: select-bid
    type: prompt
    mode: "{{ index .Params \"bid-select\" }}"
    data: "{{ toJson (index .Steps \"wait-for-bids\").bids }}"
    display:
      columns: [provider, price]
    on-error: abort

  - name: create-lease
    type: tx
    msg: market.MsgCreateLease
    params:
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
      gseq: "{{ (index .Steps \"select-bid\").gseq }}"
      oseq: "{{ (index .Steps \"select-bid\").oseq }}"
      provider: "{{ (index .Steps \"select-bid\").provider }}"
    on-error: abort

  - name: send-manifest
    type: provider
    action: send-manifest
    params:
      provider: "{{ (index .Steps \"select-bid\").provider }}"
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
      sdl: "{{ index .Params \"sdl-file\" }}"
    retry:
      max: 3
      delay: "5s"
    on-error: abort

  - name: display-result
    type: output
    template: |
      Deployment active!
        DSEQ: {{ (index .Steps "create-deployment").dseq }}
      {{ if eq (index (index .Steps "create-deployment") "rail") "console" }}
        Auto top-up: enabled ({{ (index .Steps "create-deployment").auto_top_up }})
        Disable with: akt console deployment settings {{ (index .Steps "create-deployment").dseq }} false
      {{ end }}
