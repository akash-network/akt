name: redeploy
description: Create a new deployment from an existing deployment without closing it
long: |
  Create a new deployment from an existing deployment's configuration.
  The source may be closed and is never closed by this command. Console contexts
  inherit stored secrets; chain contexts use --sdl-file or the recorded SDL path.
example: |
    # Redeploy with the saved definition and existing secrets
    akt redeploy 12345

    # Override the definition and choose the cheapest bid
    akt redeploy 12345 --sdl-file deploy.yaml --bid-select cheapest --yes
version: 1

params:
  dseq:
    type: int
    required: true
    description: Source deployment sequence to redeploy
  sdl-file:
    type: sdl
    description: Optional SDL override for the new deployment
  secrets-file:
    type: file
    description: JSON or YAML secret values file, or - for stdin (Console only)
  deposit:
    type: deposit
    default: "auto"
    description: "Initial deposit (chain rail only): auto (recommended chain minimum) or an explicit coin in the network's deposit denomination. Console deployments are funded automatically from account credits and take no deposit."
  bid-timeout:
    type: duration
    default: "5m"
    description: Maximum time to wait for bids
  ready-timeout:
    type: duration
    default: "2m"
    description: Maximum time to wait for deployed services to become ready
  no-wait-active:
    type: bool
    default: "false"
    description: Return after manifest submission without polling service readiness
  bid-select:
    type: bid-selection
    default: "interactive"
    description: "Bid selection: interactive, cheapest, provider=<full-address>"

steps:
  - name: create-deployment
    type: tx
    msg: deployment.MsgCreateDeployment
    params:
      sdl: "{{ with index .Params \"sdl-file\" }}{{ . }}{{ end }}"
      source-dseq: "{{ .Params.dseq }}"
      secrets-file: "{{ with index .Params \"secrets-file\" }}{{ . }}{{ end }}"
      deposit: "{{ .Params.deposit }}"
    on-error: abort

  - name: wait-for-bids
    type: wait
    query: market.bids
    params:
      owner: "{{ .Account }}"
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
    timeout: "{{ index .Params \"bid-timeout\" }}"
    until: "{{ ge (len .Result.bids) 1 }}"
    timeout-error: "no bids received (at least 1 required)"
    on-error: abort

  - name: select-bid
    type: prompt
    mode: "{{ index .Params \"bid-select\" }}"
    data: "{{ toJson (index .Steps \"wait-for-bids\").bids }}"
    display:
      columns: [provider, price]
    on-error: abort

  - name: create-lease
    type: tx
    msg: market.MsgCreateLease
    params:
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
      gseq: "{{ (index .Steps \"select-bid\").gseq }}"
      oseq: "{{ (index .Steps \"select-bid\").oseq }}"
      provider: "{{ (index .Steps \"select-bid\").provider }}"
    on-error: abort

  - name: send-manifest
    type: provider
    action: send-manifest
    params:
      provider: "{{ (index .Steps \"select-bid\").provider }}"
      dseq: "{{ (index .Steps \"create-deployment\").dseq }}"
      sdl: "{{ with index .Params \"sdl-file\" }}{{ . }}{{ end }}"
    retry:
      max: 3
      delay: "5s"
    on-error: abort

  - name: display-result
    type: output
    template: |
      Deployment created!
        DSEQ: {{ (index .Steps "create-deployment").dseq }}
