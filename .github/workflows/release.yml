name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run for a manual trigger"
        type: choice
        default: snapshot
        options:
          - check
          - snapshot
          - dry-run

concurrency:
  # Never cancel a run that may be halfway through uploading release assets.
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: off

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # goreleaser creates the GitHub release and uploads the archives,
      # packages and checksums to it.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version baked into the binary comes from `git describe`, so the
          # single-commit default checkout is not enough.
          fetch-depth: 0

      - name: Fetch tags
        # actions/checkout does not always bring annotated tag objects along,
        # and goreleaser needs the annotation to build the changelog.
        run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Load repo build environment
        # The release targets expect the direnv-managed variables (AKT_ROOT and
        # the AKT_DEVCACHE_* paths). .env is plain shell, so source it here
        # rather than duplicating those paths in this workflow.
        run: |
          set -euo pipefail
          export AKT_ROOT="$GITHUB_WORKSPACE"
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          env | grep -E '^(AKT_ROOT|AKT_DEVCACHE|AKT_RUN)' >> "$GITHUB_ENV"

      # Everything below shells out to `make`, which drives goreleaser inside
      # ghcr.io/goreleaser/goreleaser-cross (see make/releasing.mk). Docker is
      # preinstalled on the GitHub-hosted runners.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release

      - name: Manual run (${{ inputs.mode }})
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
        run: make "release-${MODE}"

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: akt-${{ inputs.mode }}
          path: |
            .cache/goreleaser/*.zip
            .cache/goreleaser/*.deb
            .cache/goreleaser/*.rpm
            .cache/goreleaser/*checksums.txt
          if-no-files-found: error
          retention-days: 7
