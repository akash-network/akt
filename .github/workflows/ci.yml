name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Pull requests retain their running sandbox owner. Main pushes use the
  # tested SHA so GitHub cannot cancel or displace an intermediate exact base.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOWORK: off
  # Make's release-equivalent linker flags include this search path. CI has no
  # direnv session, so keep it explicit rather than emitting an invalid bare
  # `-L` while building the coverage-instrumented binary.
  AKT_DEVCACHE_LIB: ${{ github.workspace }}/.cache/lib

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must match GOLANGCI_LINT_VERSION in the Makefile, and must be
          # built with Go >= the go directive in go.mod — older releases
          # refuse to load a config targeting a newer language version.
          # The action major must support golangci-lint v2.
          version: v2.11.4
          args: --timeout=10m

  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Unit tests (excluding e2e)
        # e2e is excluded here: it shells out to a built binary and has its
        # own jobs. Piped into xargs rather than an unquoted command
        # substitution, which relies on word splitting (SC2046).
        run: go list ./... | grep -v /e2e | xargs go test

  race-active:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Race detector over active packages
        run: make test-race-active

  coverage-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cross-package unit coverage
        run: make test-coverage-unit
      - name: Validate unit shard before upload
        if: success()
        run: make test-coverage-shard-ready COVERAGE_SHARD=unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: coverage-covdata-unit
          path: .cache/coverage/covdata/unit/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  e2e-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build coverage-instrumented akt binary
        run: make test-coverage-binary
      - name: Prepare isolated coverage shard
        run: make test-coverage-e2e-prepare COVERAGE_SHARD=e2e-offline
      - name: e2e offline suite (gated localnet tests self-skip)
        env:
          GOCOVERDIR: ${{ github.workspace }}/.cache/coverage/covdata/e2e-offline
        run: go test ./e2e/... -v -count=1
      - name: Validate offline shard before upload
        run: make test-coverage-shard-ready COVERAGE_SHARD=e2e-offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: coverage-covdata-e2e-offline
          path: .cache/coverage/covdata/e2e-offline/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  e2e-localnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build coverage-instrumented akt binary
        run: make test-coverage-binary
      - name: Prepare isolated coverage shard
        run: make test-coverage-e2e-prepare COVERAGE_SHARD=e2e-localnet
      # The immutable node image digest lives in one place — defaultNodeImage
      # in e2e/localnet_test.go — so this job pins by using the harness default.
      # Pinning keeps the blocking gate reproducible: a red run means this
      # change broke something, not that upstream published a release.
      - name: e2e localnet suite (single-validator akash node in docker)
        env:
          AKT_E2E_LOCALNET: "1"
          GOCOVERDIR: ${{ github.workspace }}/.cache/coverage/covdata/e2e-localnet
        run: go test ./e2e/ -run TestLocalnet -v -count=1 -timeout 15m
      - name: Validate localnet shard before upload
        run: make test-coverage-shard-ready COVERAGE_SHARD=e2e-localnet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: coverage-covdata-e2e-localnet
          path: .cache/coverage/covdata/e2e-localnet/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  coverage-report:
    needs: [coverage-unit, e2e-offline, e2e-localnet]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require every blocking coverage lane
        env:
          UNIT_RESULT: ${{ needs.coverage-unit.result }}
          OFFLINE_RESULT: ${{ needs.e2e-offline.result }}
          LOCALNET_RESULT: ${{ needs.e2e-localnet.result }}
        run: |
          test "$UNIT_RESULT" = success || { echo "coverage-unit result: $UNIT_RESULT" >&2; exit 1; }
          test "$OFFLINE_RESULT" = success || { echo "e2e-offline result: $OFFLINE_RESULT" >&2; exit 1; }
          test "$LOCALNET_RESULT" = success || { echo "e2e-localnet result: $LOCALNET_RESULT" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The local changed-line gate compares the actual PR base and the
          # tested merge commit; both revisions must be present.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-covdata-unit
          path: .cache/coverage/covdata/unit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-covdata-e2e-offline
          path: .cache/coverage/covdata/e2e-offline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-covdata-e2e-localnet
          path: .cache/coverage/covdata/e2e-localnet
      - name: Resolve coverage comparison revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              if test -z "$base" || test "$base" = 0000000000000000000000000000000000000000; then
                base="$(git rev-parse "$TESTED_SHA^")"
              fi
              ;;
            *)
              base="$(git rev-parse "$TESTED_SHA^")"
              ;;
          esac
          case "$base:$TESTED_SHA" in
            *[!0-9a-fA-F:]*|*:*:*|:*|*:)
              echo "coverage comparison did not resolve to commit hashes" >&2
              exit 1
              ;;
          esac
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          git rev-parse --verify "$base^{commit}" >/dev/null
          git rev-parse --verify "$TESTED_SHA^{commit}" >/dev/null
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "HEAD_REF=$TESTED_SHA" >> "$GITHUB_ENV"
      - name: Merge blocking coverage profiles
        run: make test-coverage-report
      - name: Enforce 100% changed active-line coverage
        run: make test-coverage-patch
      - name: Record tested pull-request coverage identity
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for value in "$PR_NUMBER" "$RUN_ID"; do
            case "$value" in
              *[!0-9]*|'') echo "invalid pull-request run identity" >&2; exit 1 ;;
            esac
          done
          for sha in "$BASE_SHA" "$HEAD_SHA" "$TESTED_SHA"; do
            case "$sha" in
              *[!0-9a-fA-F]*|'') echo "invalid coverage identity SHA" >&2; exit 1 ;;
            esac
            test "${#sha}" -eq 40 || { echo "coverage identity SHA must contain 40 hexadecimal characters" >&2; exit 1; }
          done
          metadata=.cache/coverage/reports/codecov-pr-metadata.tsv
          {
            printf 'field\tvalue\n'
            printf 'repository\t%s\n' "$REPOSITORY"
            printf 'run_id\t%s\n' "$RUN_ID"
            printf 'pr_number\t%s\n' "$PR_NUMBER"
            printf 'base_sha\t%s\n' "$BASE_SHA"
            printf 'head_sha\t%s\n' "$HEAD_SHA"
            printf 'tested_sha\t%s\n' "$TESTED_SHA"
          } > "$metadata"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-reports
          path: .cache/coverage/reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: coverage-profiles
          path: .cache/coverage/reports/*.out
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        with:
          name: coverage-comparison-profiles
          path: |
            .cache/coverage/reports/active-union.out
            .cache/coverage/reports/experimental-tui-union.out
            .cache/coverage/reports/tooling-unit.out
            .cache/coverage/reports/codecov-pr-metadata.tsv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          overwrite: true

  e2e-console-sandbox:
    # Fork and Dependabot pull requests never receive secrets. A core member
    # must mirror those commits to a repository branch before this lane can run.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: coverage-report
    environment: console-sandbox
    concurrency:
      group: console-sandbox
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require the protected sandbox inputs
        env:
          API_KEY: ${{ secrets.AKT_E2E_CONSOLE_MUTATION_API_KEY }}
          API_URL: ${{ secrets.AKT_E2E_CONSOLE_API_URL }}
          MUTATION_OPT_IN: ${{ secrets.AKT_E2E_CONSOLE_MUTATION }}
        run: |
          test -n "$API_KEY"
          test -n "$API_URL"
          test "$MUTATION_OPT_IN" = I_UNDERSTAND_THIS_SPENDS_SANDBOX_FUNDS
      - name: Build coverage-instrumented akt binary
        run: make test-coverage-binary
      - name: Prepare isolated live coverage shard
        run: make test-coverage-e2e-prepare COVERAGE_SHARD=e2e-live
      - name: Real Console state-independent read suite
        env:
          AKT_E2E_CONSOLE_API_KEY: ${{ secrets.AKT_E2E_CONSOLE_MUTATION_API_KEY }}
          AKT_E2E_CONSOLE_API_URL: ${{ secrets.AKT_E2E_CONSOLE_API_URL }}
          AKT_E2E_CONSOLE_MUTATION: ${{ secrets.AKT_E2E_CONSOLE_MUTATION }}
          GOCOVERDIR: ${{ github.workspace }}/.cache/coverage/covdata/e2e-live
        run: go test ./e2e/ -run '^TestConsoleLive$' -v -count=1 -timeout 8m
      - name: Bounded Console sandbox lifecycle
        env:
          AKT_E2E_CONSOLE_API_KEY: ${{ secrets.AKT_E2E_CONSOLE_MUTATION_API_KEY }}
          AKT_E2E_CONSOLE_MUTATION: ${{ secrets.AKT_E2E_CONSOLE_MUTATION }}
          AKT_E2E_CONSOLE_API_URL: ${{ secrets.AKT_E2E_CONSOLE_API_URL }}
          AKT_E2E_CONSOLE_MAX_REQUEST_USD: ${{ vars.AKT_E2E_CONSOLE_MAX_REQUEST_USD }}
          AKT_E2E_CONSOLE_MAX_SPEND_USD: ${{ vars.AKT_E2E_CONSOLE_MAX_SPEND_USD }}
          AKT_E2E_CONSOLE_MAX_DEPLOYMENTS: ${{ vars.AKT_E2E_CONSOLE_MAX_DEPLOYMENTS }}
          AKT_E2E_CONSOLE_MAX_RUNTIME: ${{ vars.AKT_E2E_CONSOLE_MAX_RUNTIME }}
          GOCOVERDIR: ${{ github.workspace }}/.cache/coverage/covdata/e2e-live
        run: go test ./e2e/ -run '^TestConsoleLiveManagedWalletLifecycle$' -v -count=1 -timeout 12m
      - name: Validate live shard before upload
        run: make test-coverage-shard-ready COVERAGE_SHARD=e2e-live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: coverage-covdata-e2e-live
          path: .cache/coverage/covdata/e2e-live/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  coverage-live-report:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: [coverage-report, e2e-console-sandbox]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-covdata-e2e-live
          path: .cache/coverage/covdata/e2e-live
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-covdata-unit
          path: .cache/coverage/covdata/unit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-covdata-e2e-offline
          path: .cache/coverage/covdata/e2e-offline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-covdata-e2e-localnet
          path: .cache/coverage/covdata/e2e-localnet
      - name: Build informational union-live profile
        run: make test-coverage-live-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-live
          path: |
            .cache/coverage/reports/live.out
            .cache/coverage/reports/live-active.out
            .cache/coverage/reports/live-active.tsv
            .cache/coverage/reports/active-union-live.out
            .cache/coverage/reports/active-union-live.tsv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          overwrite: true

  codecov-upload:
    name: coverage-upload-main
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: coverage-report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # Codecov expects Git metadata. Build only that metadata: no source is
      # checked out and no repository-owned command runs in the OIDC job.
      - name: Prepare tested commit metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          case "$TESTED_SHA" in
            *[!0-9a-fA-F]*|'') echo "invalid tested SHA" >&2; exit 1 ;;
          esac
          if test "${#TESTED_SHA}" -ne 40; then
            echo "tested SHA must contain 40 hexadecimal characters" >&2
            exit 1
          fi
          git init --quiet
          git remote add origin "$SERVER_URL/$REPOSITORY.git"
          git fetch --no-tags --depth=2 origin "$TESTED_SHA"
          parent_sha="$(git show -s --format=%P "$TESTED_SHA")"
          parent_sha="${parent_sha%% *}"
          case "$parent_sha" in
            *[!0-9a-fA-F]*|'') echo "invalid tested parent SHA" >&2; exit 1 ;;
          esac
          if test "${#parent_sha}" -ne 40; then
            echo "tested parent SHA must contain 40 hexadecimal characters" >&2
            exit 1
          fi
          if test "$EVENT_NAME" = push; then
            case "$PUSH_BEFORE_SHA" in
              *[!0-9a-fA-F]*|''|0000000000000000000000000000000000000000)
                echo "invalid push predecessor SHA" >&2
                exit 1
                ;;
            esac
            if test "${#PUSH_BEFORE_SHA}" -ne 40; then
              echo "push predecessor SHA must contain 40 hexadecimal characters" >&2
              exit 1
            fi
            parent_sha="$PUSH_BEFORE_SHA"
            git fetch --no-tags --depth=1 origin "$parent_sha"
          fi
          echo "CODECOV_PARENT_SHA=$parent_sha" >> "$GITHUB_ENV"
          git update-ref refs/heads/codecov "$TESTED_SHA"
          git symbolic-ref HEAD refs/heads/codecov
          git read-tree "$TESTED_SHA"
      - name: Wait for exact predecessor coverage uploads
        env:
          CODECOV_PARENT_SHA: ${{ env.CODECOV_PARENT_SHA }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$TESTED_SHA:codecov.yml"; then
            echo "tested commit does not contain the required Codecov policy" >&2
            exit 1
          fi
          if ! git cat-file -e "$CODECOV_PARENT_SHA:codecov.yml" 2>/dev/null; then
            echo "Exact predecessor predates codecov.yml; allowing the one-time seed upload."
            exit 0
          fi

          response_file="$RUNNER_TEMP/codecov-parent-uploads.json"
          uploads_url="https://api.codecov.io/api/v2/github/${REPOSITORY%%/*}/repos/${REPOSITORY#*/}/commits/$CODECOV_PARENT_SHA/uploads/?page_size=100"
          required_flags=(active-union experimental-tui tooling)
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 20 --output "$response_file" \
              --write-out '%{http_code}' "$uploads_url" || true)"
            if test "$http_code" = 200; then
              missing_flags=()
              for required_flag in "${required_flags[@]}"; do
                if ! jq -e --arg required_flag "$required_flag" \
                  'any(.results[]?; .state == "merged" and ((.flags // []) | index($required_flag)))' \
                  "$response_file" >/dev/null; then
                  missing_flags+=("$required_flag")
                fi
              done
              if (( ${#missing_flags[@]} == 0 )); then
                echo "Codecov accepted every comparison upload for $CODECOV_PARENT_SHA."
                exit 0
              fi
              echo "Waiting for predecessor Codecov flags: ${missing_flags[*]}"
            else
              echo "Waiting for predecessor Codecov uploads (HTTP $http_code)."
            fi
            sleep 10
          done
          echo "Timed out waiting for complete Codecov uploads on $CODECOV_PARENT_SHA" >&2
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-profiles
          path: coverage-profiles
      - name: Upload active union to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          version: v11.3.1
          files: coverage-profiles/active-union.out
          flags: active-union
          commit_parent: ${{ env.CODECOV_PARENT_SHA }}
          override_commit: ${{ github.sha }}
          disable_search: true
          disable_file_fixes: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload experimental TUI union to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          version: v11.3.1
          files: coverage-profiles/experimental-tui-union.out
          flags: experimental-tui
          commit_parent: ${{ env.CODECOV_PARENT_SHA }}
          override_commit: ${{ github.sha }}
          disable_search: true
          disable_file_fixes: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload tooling unit profile to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          version: v11.3.1
          files: coverage-profiles/tooling-unit.out
          flags: tooling
          commit_parent: ${{ env.CODECOV_PARENT_SHA }}
          override_commit: ${{ github.sha }}
          disable_search: true
          disable_file_fixes: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload unit profile to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          version: v11.3.1
          files: coverage-profiles/unit.out
          flags: unit
          commit_parent: ${{ env.CODECOV_PARENT_SHA }}
