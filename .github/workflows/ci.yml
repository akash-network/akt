          disable_search: true
          disable_file_fixes: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload fresh-chain E2E profile to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          version: v11.3.1
          files: coverage-profiles/e2e-localnet.out
          flags: fresh-chain
          commit_parent: ${{ env.CODECOV_PARENT_SHA }}
          override_commit: ${{ github.sha }}
          disable_search: true
          disable_file_fixes: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload blocking E2E union to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          version: v11.3.1
          files: coverage-profiles/e2e.out
          flags: e2e
          commit_parent: ${{ env.CODECOV_PARENT_SHA }}
