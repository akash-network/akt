codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default: false
      active:
        target: auto
        threshold: 0%
        if_ci_failed: error
        if_not_found: failure
        removed_code_behavior: off
        flags:
          - active-union
    patch:
      default: false
      active:
        target: 100%
        threshold: 0%
        if_ci_failed: error
        if_not_found: failure
        flags:
          - active-union

flags:
  unit:
    carryforward: false
  e2e:
    carryforward: false
  e2e-offline:
    carryforward: false
  fresh-chain:
    carryforward: false
  live:
    carryforward: false
  union-live:
    carryforward: false
  repository:
    carryforward: false
  active-union:
    carryforward: false
  experimental-tui:
    carryforward: false

comment:
  layout: reach,diff,flags,files
  require_base: true
  require_head: true

github_checks:
  annotations: false
