# yaml-language-server: $schema=https://raw.githubusercontent.com/binary-install/binstaller/main/schema/InstallSpec.json
schema: v1
name: akt
repo: akash-network/akt
asset:
  template: akt_${VERSION}_${OS}_${ARCH}${EXT}
  default_extension: .zip
  rules:
  # GoReleaser merges both macOS builds into one universal archive,
  # akt_<version>_darwin_all.zip (universal_binaries in .goreleaser.yaml).
  - when:
      os: darwin
    arch: all
  naming_convention:
    os: lowercase
    arch: lowercase
checksums:
  algorithm: sha256
  template: akt_${VERSION}_checksums.txt
supported_platforms:
- os: darwin
  arch: amd64
- os: darwin
  arch: arm64
- os: linux
  arch: amd64
- os: linux
  arch: arm64
