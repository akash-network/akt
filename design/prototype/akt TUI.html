<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>akt — Akash TUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 13px;
    line-height: 1.45;
    background:
      radial-gradient(1200px 800px at 50% 10%, #1a1a1f 0%, #0a0a0c 60%, #07070a 100%);
    color: #e7e7ea;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #46464c; }
  ::-webkit-scrollbar-corner { background: transparent; }
  /* Selection */
  ::selection { background: rgba(255,65,76,0.35); color: #fff; }
  /* Fade animation for overlays */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  /* Pre and code default reset */
  pre { font-family: inherit; }
  #root { width: 100%; height: 100%; display: grid; place-items: center; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tui-data.jsx"></script>
  <script type="text/babel" src="tui-primitives.jsx"></script>
  <script type="text/babel" src="tui-views.jsx"></script>
  <script type="text/babel" src="tui-monitor.jsx"></script>
  <script type="text/babel" src="tui-workflow.jsx"></script>
  <script type="text/babel" src="tui-overlays.jsx"></script>
  <script type="text/babel" src="tui-shell.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TUIApp />);
  </script>
</body>
</html>
