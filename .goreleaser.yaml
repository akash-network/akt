---
# goreleaser configuration for the akt CLI.
#
# This runs inside ghcr.io/goreleaser/goreleaser-cross (see make/releasing.mk),
# which ships osxcross for the darwin targets and the gnu cross toolchains for
# linux. CGO cannot be disabled here: the cosmos-sdk keyring and the ledger HID
# bindings are C libraries.
#
# akt builds with nolink_libwasmvm: it constructs and queries wasm messages
# over gRPC and never executes a contract, so the CosmWasm VM is not linked and
# no libwasmvm archives are needed. cgo stays on for the ledger HID bindings
# and the cosmos keyring.
#
# Build tags and the injected version variables are deliberately kept in sync
# with BUILD_TAGS / ldflags in the root Makefile. A release binary whose
# `akt version` reports "dev" is a bug -- both the cosmos-sdk version vars and
# akt's own main.* vars have to be set.
version: 2
project_name: akt
dist: ./.cache/goreleaser

env:
  - GO111MODULE=on
  - CGO_ENABLED=1

builds:
  - id: akt-darwin-amd64
    binary: akt
    main: ./cmd/akt
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CC=o64-clang
      - CXX=o64-clang++
      - CGO_CFLAGS=-mmacosx-version-min=11.0
    flags:
      - -mod=readonly
      - -tags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -trimpath
    ldflags:
      - -s -w
      - -linkmode=external
      - -extldflags "-mmacosx-version-min=11.0"
      - -X github.com/cosmos/cosmos-sdk/version.Name=akt
      - -X github.com/cosmos/cosmos-sdk/version.AppName=akt
      - -X github.com/cosmos/cosmos-sdk/version.BuildTags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }}
      - -X github.com/cosmos/cosmos-sdk/version.Commit={{ .FullCommit }}
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

  - id: akt-darwin-arm64
    binary: akt
    main: ./cmd/akt
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CC=oa64-clang
      - CXX=oa64-clang++
      - CGO_CFLAGS=-mmacosx-version-min=11.0
    flags:
      - -mod=readonly
      - -tags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -trimpath
    ldflags:
      - -s -w
      - -linkmode=external
      - -extldflags "-mmacosx-version-min=11.0"
      - -X github.com/cosmos/cosmos-sdk/version.Name=akt
      - -X github.com/cosmos/cosmos-sdk/version.AppName=akt
      - -X github.com/cosmos/cosmos-sdk/version.BuildTags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }}
      - -X github.com/cosmos/cosmos-sdk/version.Commit={{ .FullCommit }}
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

  - id: akt-linux-amd64
    binary: akt
    main: ./cmd/akt
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    flags:
      - -mod=readonly
      - -tags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -trimpath
    ldflags:
      - -s -w
      - -linkmode=external
      # -z muldefs tolerates duplicate symbols between the musl-built
      # dependencies and the glibc cross toolchain.
      - -extldflags "-Wl,-z,muldefs -lm -lrt -lc"
      - -X github.com/cosmos/cosmos-sdk/version.Name=akt
      - -X github.com/cosmos/cosmos-sdk/version.AppName=akt
      - -X github.com/cosmos/cosmos-sdk/version.BuildTags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }}
      - -X github.com/cosmos/cosmos-sdk/version.Commit={{ .FullCommit }}
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

  - id: akt-linux-arm64
    binary: akt
    main: ./cmd/akt
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    flags:
      - -mod=readonly
      - -tags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -trimpath
    ldflags:
      - -s -w
      - -linkmode=external
      - -extldflags "-Wl,-z,muldefs -lm -lrt -lc"
      - -X github.com/cosmos/cosmos-sdk/version.Name=akt
      - -X github.com/cosmos/cosmos-sdk/version.AppName=akt
      - -X github.com/cosmos/cosmos-sdk/version.BuildTags=osusergo,netgo,ledger,muslc,gcc,nolink_libwasmvm
      - -X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }}
      - -X github.com/cosmos/cosmos-sdk/version.Commit={{ .FullCommit }}
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

universal_binaries:
  - id: akt-darwin-universal
    ids:
      - akt-darwin-amd64
      - akt-darwin-arm64
    replace: true
    name_template: akt

archives:
  - id: akt
    ids:
      - akt-darwin-universal
      - akt-linux-amd64
      - akt-linux-arm64
    name_template: "akt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    formats:
      - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "akt_{{ .Version }}_checksums.txt"
  algorithm: sha256

nfpms:
  - id: akt
    ids:
      - akt-linux-amd64
      - akt-linux-arm64
    package_name: akt
    vendor: "Akash Network"
    homepage: "https://akash.network"
    maintainer: "Akash Network <hello@akash.network>"
    description: "Unified CLI for the Akash Network."
    license: "Apache-2.0"
    file_name_template: "akt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm

# Homebrew, published straight into akash-network/homebrew-tap as part of the
# release. node reaches the same tap by dispatching an event to it and
# regenerating akash.rb from a template there; goreleaser writes the formula
# itself, so there is no dispatch, no second workflow, and no template to keep
# in step with the archives.
#
# A formula at the tap root, alongside akash.rb and akash-provider-services.rb,
# rather than a cask under Casks/. Two reasons beyond matching the siblings:
# Homebrew refuses to install a cask from an untrusted third-party tap until
# the user runs `brew trust`, which a formula does not require, and akt is a
# plain CLI binary rather than a macOS application bundle.
#
# `brews` is deprecated in favour of `homebrew_casks` and goreleaser will drop
# it eventually; when that happens this has to move to a formula generated some
# other way, not to a cask, or the trust prompt comes back. See release-check
# in make/releasing.mk, which tolerates the deprecation warning.
brews:
  - name: akt
    ids:
      - akt
    # The tap is a different repository, so the release job's GITHUB_TOKEN --
    # scoped to this one -- cannot write to it. Needs a token with
    # contents:write on akash-network/homebrew-tap, exported as
    # GORELEASER_ACCESS_TOKEN.
    repository:
      owner: akash-network
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GORELEASER_ACCESS_TOKEN }}"
    # Repository root, where akash.rb and akash-provider-services.rb live.
    directory: .
    homepage: "https://akash.network"
    description: "Unified CLI for the Akash Network"
    license: "Apache-2.0"
    # Skip prereleases: `brew install akt` must keep resolving to the newest
    # stable build, and an alpha reaching the tap would downgrade everyone on
    # it. Same gate node applies with is_prerelease.sh.
    skip_upload: auto
    test: |
      system "#{bin}/akt", "version"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  # `use: git` (the default) keeps `release --skip=publish` working without a
  # GitHub token; switching to `use: github` would make dry runs need one.
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor\\(docs\\):"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Refactors
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 2
    - title: Other work
      order: 999

release:
  # owner/name are intentionally not pinned: goreleaser derives them from the
  # git remote of the checkout, which is what GitHub Actions gives us and what
  # keeps this correct if the repository is ever transferred between orgs. Pin
  # `github: {owner: ..., name: ...}` here if it ever needs to be forced.
  prerelease: auto
  mode: replace
  draft: false
  name_template: "akt {{ .Version }}"

report_sizes: true
